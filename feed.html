<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hooked - Feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages/feed.css">
    <style>
        [x-cloak] { display: none !important; }
        @media (min-width: 1024px) { .sidebar { display: block !important; } }
        .mobile-nav { display: flex !important; }
        .action-btn.active { color: #ef4444; }
        .action-btn.active span:first-child { filter: drop-shadow(0 0 4px rgba(239,68,68,0.5)); }
 
        /* ── Lightbox: meta del comentario ── */
        .lightbox-comentario-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
 
        /* ── Botones ✏️🗑️ en lightbox: ocultos hasta hover ── */
        .lightbox-acciones-propias {
            display: flex;
            gap: 0.25rem;
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .lightbox-comentario:hover .lightbox-acciones-propias {
            opacity: 1;
        }
    </style>
</head>
<body x-data="feedApp()" x-cloak>
 
<header class="nav-header">
    <div class="container nav-container">
        <a href="feed.html" class="logo">
            <div class="logo-icon">🎣</div>
            <span>Hooked</span>
        </a>
        <nav class="nav-links" x-show="user || isInitialized">
            <a href="feed.html" class="nav-link active">Inicio</a>
            <a href="perfil.html" class="nav-link">Perfil</a>
            <button class="theme-toggle" onclick="Utils.toggleTheme(); this.textContent = Utils.getThemeIcon()" title="Cambiar tema">☀️</button>
            <button @click="logout()" class="btn btn-ghost btn-sm">Salir</button>
        </nav>
    </div>
</header>
 
<div class="container layout layout-sidebar pb-safe">
 
    <aside class="sidebar">
        <div class="sidebar-user">
            <div class="avatar">
                <template x-if="user?.fotoPerfil"><img :src="user.fotoPerfil" :alt="user.nombre"></template>
                <template x-if="!user?.fotoPerfil"><span x-text="user?.nombre?.charAt(0)?.toUpperCase() || '?'"></span></template>
            </div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" x-text="user?.nombre || 'Cargando...'"></div>
                <div class="sidebar-user-email" x-text="user?.email || ''" x-show="user?.email"></div>
            </div>
        </div>
 
        <div class="tips-widget" x-data="tipsWidget()" x-init="init()">
            <div class="tips-header">
                <span class="tips-label">💡 Tip del día</span>
                <span class="tips-categoria" x-text="tip.categoria"></span>
            </div>
            <div class="tips-body">
                <div class="tips-emoji" x-text="tip.emoji"></div>
                <p class="tips-texto" x-text="tip.tip"></p>
            </div>
        </div>
 
        <button class="buscar-btn" @click="$dispatch('abrir-buscador')">
            <span>🔍</span>
            <span>Buscar en Hooked</span>
        </button>
    </aside>
 
    <div class="main-col">
        <div class="categorias-chips-wrap">
            <div class="categorias-chips">
                <button class="categoria-chip" :class="{ 'active': !selectedCategory || selectedCategory === 'todo' }" @click="filterByCategory('todo')">
                    <span>#</span> Todas
                </button>
                <template x-for="cat in (categorias || [])" :key="cat.id">
                    <button class="categoria-chip" :class="{ 'active': selectedCategory == cat.id }" @click="filterByCategory(cat.id)">
                        <span x-text="cat.nombre"></span>
                    </button>
                </template>
            </div>
        </div>
 
        <main class="main-content">
            <template x-if="loading && posts.length === 0">
                <div>
                    <div class="loading-skeleton">
                        <div class="skeleton-header">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-lines">
                                <div class="skeleton-line short"></div>
                                <div class="skeleton-line" style="width:30%"></div>
                            </div>
                        </div>
                        <div class="skeleton-image"></div>
                    </div>
                    <div class="loading-skeleton" style="margin-top:1rem">
                        <div class="skeleton-header">
                            <div class="skeleton-avatar"></div>
                            <div class="skeleton-lines">
                                <div class="skeleton-line short"></div>
                                <div class="skeleton-line" style="width:30%"></div>
                            </div>
                        </div>
                        <div class="skeleton-image"></div>
                    </div>
                </div>
            </template>
 
            <div class="empty-state" x-show="!loading && posts.length === 0">
                <div class="empty-state-icon">🎣</div>
                <h3 style="margin-bottom:0.5rem; color:var(--text-primary)">No hay capturas aún</h3>
                <p style="margin-bottom:1.5rem">Sé el primero en compartir tu experiencia</p>
                <a href="crear-post.html" class="btn btn-primary">Crear primer post</a>
            </div>
 
            <div class="feed-grid" x-show="!loading && posts.length > 0">
                <template x-for="post in (posts || [])" :key="post.id">
                    <article class="post-card animate-fade-in">
                        <div class="post-header">
                            <div class="avatar">
                                <template x-if="post.usuario?.foto_perfil"><img :src="post.usuario.foto_perfil" :alt="post.usuario?.nombre"></template>
                                <template x-if="!post.usuario?.foto_perfil"><span x-text="(post.usuario?.nombre || '?').charAt(0).toUpperCase()"></span></template>
                            </div>
                            <div class="post-meta">
                                <a :href="'perfil.html?id=' + post.usuario?.id" class="post-author" x-text="post.usuario?.nombre || 'Usuario'"></a>
                                <span class="post-time" x-text="formatDate(post.fecha_creacion)"></span>
                            </div>
                            <span class="post-category" x-text="post.categoria?.nombre || ''"></span>
                        </div>
                        <template x-if="post.foto_link">
                            <img :src="post.foto_link" :alt="post.titulo" class="post-image" @click="abrirLightbox(post)" style="cursor:pointer">
                        </template>
                        <div class="post-content">
                            <h2 class="post-title" x-text="post.titulo"></h2>
                            <p class="post-text" x-text="post.contenido"></p>
                        </div>
                        <div class="post-actions">
                            <button class="action-btn" :class="{ 'active': post.liked }" @click="toggleLike(post)">
                                <span x-text="post.liked ? '❤️' : '🤍'"></span>
                                <span x-text="post.like_count || 0"></span>
                            </button>
                            <a :href="'post.html?id=' + post.id" class="action-btn">
                                <span>💬</span>
                                <span x-text="(post.comentarios_count || 0) + ' comentarios'"></span>
                            </a>
                            <button class="action-btn" @click="sharePost(post)">
                                <span>🔗</span><span>Compartir</span>
                            </button>
                        </div>
                    </article>
                </template>
            </div>
        </main>
    </div>
</div>
 
<!-- MODAL BÚSQUEDA — hijo directo del body, igual que el lightbox -->
<div class="buscar-overlay"
     x-data="buscarApp()"
     x-show="buscar.abierto"
     @abrir-buscador.window="abrirModal()"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click.self="cerrar()"
     @keydown.escape.window="cerrar()"
     x-cloak>
    <div class="buscar-modal">
        <div class="buscar-input-wrap">
            <span class="buscar-input-icon">🔍</span>
            <input class="buscar-input" type="text" placeholder="Busca posts, personas, categorías..."
                x-model="buscar.query" @input.debounce.400ms="buscarTodo()" @keydown.enter="buscarTodo()"
                x-ref="inputBuscar" autocomplete="off">
            <button class="buscar-close" @click="cerrar()">✕</button>
        </div>
        <div class="buscar-tabs">
            <button class="buscar-tab" :class="{ active: buscar.tabActiva === 'todo' }" @click="cambiarTab('todo')">🌊 Todo</button>
            <button class="buscar-tab" :class="{ active: buscar.tabActiva === 'posts' }" @click="cambiarTab('posts')">
                📝 Posts
                <span class="buscar-tab-badge" x-show="buscar.posts.length > 0" x-text="buscar.posts.length"></span>
            </button>
            <button class="buscar-tab" :class="{ active: buscar.tabActiva === 'personas' }" @click="cambiarTab('personas')">
                🎣 Personas
                <span class="buscar-tab-badge" x-show="buscar.usuarios.length > 0" x-text="buscar.usuarios.length"></span>
            </button>
            <button class="buscar-tab buscar-tab--pronto" title="Próximamente" @click.prevent>
                📍 Spots <span class="buscar-tab-badge">Pronto</span>
            </button>
            <button class="buscar-tab buscar-tab--pronto" title="Próximamente" @click.prevent>
                🏪 Tiendas <span class="buscar-tab-badge">Pronto</span>
            </button>
        </div>
        <div class="buscar-body">
            <template x-if="!buscar.query.trim() && !buscar.loading">
                <div class="buscar-empty">
                    <div class="buscar-empty-icon">🎣</div>
                    <p>Escribe algo para buscar posts, personas y más.</p>
                </div>
            </template>
            <template x-if="buscar.loading">
                <div class="buscar-loading">
                    <div class="buscar-spinner"></div>Buscando...
                </div>
            </template>
            <!-- Tab: TODO -->
            <template x-if="!buscar.loading && buscar.tabActiva === 'todo' && buscar.query.trim()">
                <div>
                    <template x-if="buscar.usuarios.length === 0 && buscar.posts.length === 0">
                        <div class="buscar-sin-resultados">
                            No encontramos nada para "<strong x-text="buscar.query"></strong>" 🎣
                        </div>
                    </template>
                    <template x-if="buscar.usuarios.length > 0">
                        <div>
                            <div class="buscar-seccion-titulo">Personas</div>
                            <template x-for="u in buscar.usuarios.slice(0, 3)" :key="u.id">
                                <a class="buscar-res-usuario" :href="'perfil.html?id=' + u.id">
                                    <div class="buscar-res-avatar">
                                        <template x-if="u.fotoPerfil"><img :src="u.fotoPerfil" :alt="u.nombre"></template>
                                        <template x-if="!u.fotoPerfil"><span x-text="(u.nombre || '?').charAt(0).toUpperCase()"></span></template>
                                    </div>
                                    <div class="buscar-res-info">
                                        <div class="buscar-res-nombre" x-text="u.nombre"></div>
                                        <div class="buscar-res-sub" x-text="u.ubicacionPreferida || u.bio || u.email"></div>
                                    </div>
                                    <span class="buscar-res-nivel" x-text="u.nivelPescador || 'Principiante'"></span>
                                </a>
                            </template>
                        </div>
                    </template>
                    <template x-if="buscar.usuarios.length > 0 && buscar.posts.length > 0">
                        <hr class="buscar-divider">
                    </template>
                    <template x-if="buscar.posts.length > 0">
                        <div>
                            <div class="buscar-seccion-titulo">Posts</div>
                            <template x-for="p in buscar.posts.slice(0, 4)" :key="p.id">
                                <a class="buscar-res-post" :href="'post.html?id=' + p.id">
                                    <div class="buscar-res-post-thumb">
                                        <template x-if="p.fotoLink"><img :src="p.fotoLink" :alt="p.titulo"></template>
                                        <template x-if="!p.fotoLink"><span>🎣</span></template>
                                    </div>
                                    <div class="buscar-res-post-info">
                                        <div class="buscar-res-post-titulo" x-text="p.titulo"></div>
                                        <div class="buscar-res-post-meta">
                                            <span class="buscar-res-post-autor" x-text="'por ' + (p.autor?.nombre || 'Desconocido')"></span>
                                            <span class="buscar-res-post-cat" x-show="p.categoria?.nombre" x-text="p.categoria?.nombre"></span>
                                        </div>
                                        <p class="buscar-res-post-contenido" x-text="p.contenido"></p>
                                    </div>
                                </a>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
            <!-- Tab: PERSONAS -->
            <template x-if="!buscar.loading && buscar.tabActiva === 'personas' && buscar.query.trim()">
                <div>
                    <template x-if="buscar.usuarios.length === 0">
                        <div class="buscar-sin-resultados">No encontramos personas para "<strong x-text="buscar.query"></strong>" 🎣</div>
                    </template>
                    <template x-for="u in buscar.usuarios" :key="u.id">
                        <a class="buscar-res-usuario" :href="'perfil.html?id=' + u.id">
                            <div class="buscar-res-avatar">
                                <template x-if="u.fotoPerfil"><img :src="u.fotoPerfil" :alt="u.nombre"></template>
                                <template x-if="!u.fotoPerfil"><span x-text="(u.nombre || '?').charAt(0).toUpperCase()"></span></template>
                            </div>
                            <div class="buscar-res-info">
                                <div class="buscar-res-nombre" x-text="u.nombre"></div>
                                <div class="buscar-res-sub" x-text="u.ubicacionPreferida || u.bio || u.email"></div>
                            </div>
                            <span class="buscar-res-nivel" x-text="u.nivelPescador || 'Principiante'"></span>
                        </a>
                    </template>
                </div>
            </template>
            <!-- Tab: POSTS -->
            <template x-if="!buscar.loading && buscar.tabActiva === 'posts' && buscar.query.trim()">
                <div>
                    <template x-if="buscar.posts.length === 0">
                        <div class="buscar-sin-resultados">No encontramos posts para "<strong x-text="buscar.query"></strong>" 🎣</div>
                    </template>
                    <template x-for="p in buscar.posts" :key="p.id">
                        <a class="buscar-res-post" :href="'post.html?id=' + p.id">
                            <div class="buscar-res-post-thumb">
                                <template x-if="p.fotoLink"><img :src="p.fotoLink" :alt="p.titulo"></template>
                                <template x-if="!p.fotoLink"><span>🎣</span></template>
                            </div>
                            <div class="buscar-res-post-info">
                                <div class="buscar-res-post-titulo" x-text="p.titulo"></div>
                                <div class="buscar-res-post-meta">
                                    <span class="buscar-res-post-autor" x-text="'por ' + (p.autor?.nombre || 'Desconocido')"></span>
                                    <span class="buscar-res-post-cat" x-show="p.categoria?.nombre" x-text="p.categoria?.nombre"></span>
                                </div>
                                <p class="buscar-res-post-contenido" x-text="p.contenido"></p>
                            </div>
                        </a>
                    </template>
                </div>
            </template>
            <!-- Tab: SPOTS -->
            <template x-if="buscar.tabActiva === 'spots'">
                <div class="buscar-proximamente">
                    <div class="buscar-prox-icon">📍</div>
                    <span class="badge-pronto">Próximamente</span>
                    <h3>Spots de pesca</h3>
                    <p>Pronto podrás buscar y descubrir los mejores spots cerca de ti, con ubicación exacta en el mapa.</p>
                </div>
            </template>
            <!-- Tab: TIENDAS -->
            <template x-if="buscar.tabActiva === 'tiendas'">
                <div class="buscar-proximamente">
                    <div class="buscar-prox-icon">🏪</div>
                    <span class="badge-pronto">Próximamente</span>
                    <h3>Tiendas de pesca</h3>
                    <p>Las tiendas tendrán su propio perfil en Hooked. Podrás buscarlas, ver sus productos y ubicación.</p>
                </div>
            </template>
        </div>
    </div>
</div>
 
<!-- LIGHTBOX DE COMENTARIOS (sin cambios) -->
<div class="lightbox-overlay" x-show="lightbox.abierto"
     x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
     @click.self="cerrarLightbox()" @keydown.escape.window="cerrarLightbox()" x-cloak>
    <div class="lightbox-container">
        <button class="lightbox-close" @click="cerrarLightbox()">✕</button>
        <div class="lightbox-imagen">
            <img :src="lightbox.post?.foto_link" :alt="lightbox.post?.titulo" class="lightbox-img">
        </div>
        <div class="lightbox-panel">
            <div class="lightbox-autor">
                <div class="avatar avatar-sm">
                    <template x-if="lightbox.post?.usuario?.foto_perfil"><img :src="lightbox.post.usuario.foto_perfil" :alt="lightbox.post.usuario.nombre"></template>
                    <template x-if="!lightbox.post?.usuario?.foto_perfil"><span x-text="(lightbox.post?.usuario?.nombre || '?').charAt(0).toUpperCase()"></span></template>
                </div>
                <div>
                    <div class="lightbox-autor-nombre" x-text="lightbox.post?.usuario?.nombre"></div>
                    <div class="lightbox-autor-fecha" x-text="formatDate(lightbox.post?.fecha_creacion)"></div>
                </div>
                <span class="post-category" x-text="lightbox.post?.categoria?.nombre"></span>
            </div>
            <div class="lightbox-contenido">
                <h3 class="lightbox-titulo" x-text="lightbox.post?.titulo"></h3>
                <p class="lightbox-texto" x-text="lightbox.post?.contenido"></p>
            </div>
            <div class="lightbox-acciones">
                <button class="action-btn" :class="{ 'active': lightbox.post?.liked }" @click="toggleLikeLightbox()">
                    <span x-text="lightbox.post?.liked ? '❤️' : '🤍'"></span>
                    <span x-text="lightbox.post?.like_count || 0"></span>
                </button>
                <div class="action-btn">
                    <span>💬</span>
                    <span x-text="(lightbox.comentarios?.length || 0) + ' comentarios'"></span>
                </div>
                <button class="action-btn" @click="sharePost(lightbox.post)"><span>🔗</span><span>Compartir</span></button>
                <a :href="'post.html?id=' + lightbox.post?.id" class="action-btn"><span>↗</span><span>Ver post completo</span></a>
            </div>
            <div class="lightbox-comentarios">
                <template x-if="lightbox.loadingComentarios">
                    <div class="lightbox-loading">Cargando comentarios...</div>
                </template>
                <div class="lightbox-comentarios-lista" x-show="!lightbox.loadingComentarios">
                    <template x-if="lightbox.comentarios.length === 0">
                        <p class="lightbox-sin-comentarios">Sé el primero en comentar 🎣</p>
                    </template>
                    <template x-for="comentario in lightbox.comentarios" :key="comentario.id">
                        <div class="lightbox-comentario">
                            <div class="avatar avatar-xs">
                                <template x-if="comentario.autor?.fotoPerfil"><img :src="comentario.autor.fotoPerfil" :alt="comentario.autor.nombre"></template>
                                <template x-if="!comentario.autor?.fotoPerfil"><span x-text="(comentario.autor?.nombre || '?').charAt(0).toUpperCase()"></span></template>
                            </div>
                            <div class="lightbox-comentario-cuerpo">
                                <div class="lightbox-comentario-meta">
                                    <span class="lightbox-comentario-autor" x-text="comentario.autor?.nombre"></span>
                                    <template x-if="esPropioLightbox(comentario)">
                                        <div class="lightbox-acciones-propias">
                                            <button class="btn-accion-comentario btn-editar" @click="editarComentarioLightbox(comentario)" title="Editar">✏️</button>
                                            <button class="btn-accion-comentario btn-eliminar" @click="eliminarComentarioLightbox(comentario)" title="Eliminar">🗑️</button>
                                        </div>
                                    </template>
                                </div>
                                <template x-if="lightbox.comentarioEditando?.id !== comentario.id">
                                    <p class="lightbox-comentario-texto" x-text="comentario.contenido"></p>
                                </template>
                                <template x-if="lightbox.comentarioEditando?.id === comentario.id">
                                    <div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:0.25rem;">
                                        <textarea class="lightbox-textarea" x-model="lightbox.textoEditando" rows="2" maxlength="500"></textarea>
                                        <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                                            <button class="btn btn-ghost btn-sm" @click="cancelarEdicionLightbox()">Cancelar</button>
                                            <button class="btn btn-primary btn-sm" @click="guardarEdicionLightbox()">Guardar</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="lightbox-nuevo-comentario">
                    <div class="avatar avatar-xs">
                        <template x-if="user?.fotoPerfil"><img :src="user.fotoPerfil" :alt="user.nombre"></template>
                        <template x-if="!user?.fotoPerfil"><span x-text="(user?.nombre || '?').charAt(0).toUpperCase()"></span></template>
                    </div>
                    <div class="lightbox-input-wrap">
                        <textarea class="lightbox-textarea" x-model="lightbox.nuevoComentario"
                            placeholder="Escribe un comentario... 🎣" rows="2" maxlength="500"
                            @keydown.ctrl.enter="enviarComentarioLightbox()"></textarea>
                        <button class="btn btn-primary btn-sm" @click="enviarComentarioLightbox()"
                            :disabled="!lightbox.nuevoComentario.trim() || lightbox.enviando">
                            <span x-show="!lightbox.enviando">Comentar</span>
                            <span x-show="lightbox.enviando">...</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
 
<!-- ── BOTTOM NAV MÓVIL ───────────────────────────────────── -->
<nav class="bottom-nav">
    <a href="crear-post.html" class="bottom-nav-item bottom-nav-item--crear">
        <span class="bottom-nav-icon">➕</span>
        <span>Crear</span>
    </a>
    <a href="feed.html" class="bottom-nav-item active">
        <span class="bottom-nav-icon">🏠</span>
        <span>Feed</span>
    </a>
    <a href="perfil.html" class="bottom-nav-item">
        <span class="bottom-nav-icon">👤</span>
        <span>Perfil</span>
    </a>
</nav>
 
<!-- ── TOASTS ─────────────────────────────────────────────── -->
<div class="toast-container" x-data="{ toasts: [] }"
    @toast.window="toasts.push($event.detail); setTimeout(() => toasts.shift(), 3000)">
    <template x-for="toast in toasts" :key="toast.message">
        <div class="toast" :class="toast.type" x-text="toast.message"></div>
    </template>
</div>
